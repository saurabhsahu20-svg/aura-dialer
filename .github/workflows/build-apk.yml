name: Build Aura Dialer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 14 SDK with preinstalled command-line tools
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Compile APK and keep error log
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Dialer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Post diagnostic issue if build fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Build #%s failed. Original run: %s\n\n' "${{ github.run_number }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > diagnostic.md
          printf 'Recent Gradle log:\n\x60\x60\x60text\n' >> diagnostic.md
          if test -f build.log; then tail -n 100 build.log >> diagnostic.md; else printf 'The workflow failed before or during setup, before Gradle could write its log.\n' >> diagnostic.md; fi
          printf '\n\x60\x60\x60\n' >> diagnostic.md
          gh issue create --title "APK build diagnostic #${{ github.run_number }}" --body-file diagnostic.md
